<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contador personalizado</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="estilos.css"></head><body>
<nav class="navbar"><div class="container"><a class="navbar-brand fw-bold" href="index.html">Prácticas JS</a><a class="btn btn-sm btn-light" href="index.html">⌂ Menú principal</a></div></nav>
<main class="container py-4"><div class="row justify-content-center"><div class="col-12 col-lg-8"><div class="card"><div class="card-header p-3">Práctica 3 · While</div><div class="card-body p-4">
<h1 class="h3">Contador personalizado</h1><p class="text-secondary">Ingresa los datos (si se solicitan) y presiona “Ejecutar ejercicio”.</p>
<form id="formEjercicio" class="mb-3"><div class="mb-3"><label for="inicio" class="form-label">Número inicial</label><input class="form-control" id="inicio" type="number" required></div><div class="mb-3"><label for="fin" class="form-label">Número final</label><input class="form-control" id="fin" type="number" required></div><button type="submit" class="btn btn-primary">Ejecutar ejercicio</button></form><div id="resultado" class="resultado" aria-live="polite">Aquí aparecerá el resultado.</div>
<div class="d-flex flex-wrap justify-content-between gap-2 mt-4"><a class="btn btn-outline-secondary" href="while2.html">← Anterior</a><a class="btn btn-primary" href="index.html">Volver al menú</a><a class="btn btn-outline-secondary" href="while4.html">Siguiente →</a></div>
</div></div></div></div></main><footer class="container text-center py-4">Práctica 3 de 25</footer><script>
function mostrar(texto){document.getElementById("resultado").innerHTML=texto;}
document.getElementById("formEjercicio").addEventListener("submit", function(e){e.preventDefault(); let inicio = Number(document.getElementById("inicio").value);
let fin = Number(document.getElementById("fin").value);
let salida = "";
if (inicio <= fin) {
 while (inicio <= fin) { salida += inicio + "<br>"; inicio++; }
} else { mostrar("El número inicial debe ser menor o igual al final."); }
if (salida) mostrar(salida); });
</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
