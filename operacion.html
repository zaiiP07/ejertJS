<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Calculadora de suma, resta y multiplicación</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="estilos.css"></head><body>
<nav class="navbar"><div class="container"><a class="navbar-brand fw-bold" href="index.html">Prácticas JS</a><a class="btn btn-sm btn-light" href="index.html">⌂ Menú principal</a></div></nav>
<main class="container py-4"><div class="row justify-content-center"><div class="col-12 col-lg-8"><div class="card"><div class="card-header p-3">Práctica 15 · Operaciones</div><div class="card-body p-4">
<h1 class="h3">Calculadora de suma, resta y multiplicación</h1><p class="text-secondary">Ingresa los datos (si se solicitan) y presiona “Ejecutar ejercicio”.</p>
<form id="formEjercicio" class="mb-3"><div class="mb-3"><label for="a" class="form-label">Primer número</label><input class="form-control" id="a" type="number" required></div><div class="mb-3"><label for="b" class="form-label">Segundo número</label><input class="form-control" id="b" type="number" required></div><div class="mb-3"><label for="operacion" class="form-label">Operación</label><select class="form-select" id="operacion" required><option value="">Selecciona...</option><option value="suma">Suma</option><option value="resta">Resta</option><option value="multiplicacion">Multiplicación</option></select></div><button type="submit" class="btn btn-primary">Ejecutar ejercicio</button></form><div id="resultado" class="resultado" aria-live="polite">Aquí aparecerá el resultado.</div>
<div class="d-flex flex-wrap justify-content-between gap-2 mt-4"><a class="btn btn-outline-secondary" href="positivo.html">← Anterior</a><a class="btn btn-primary" href="index.html">Volver al menú</a><a class="btn btn-outline-secondary" href="operaciones.html">Siguiente →</a></div>
</div></div></div></div></main><footer class="container text-center py-4">Práctica 15 de 25</footer><script>
function mostrar(texto){document.getElementById("resultado").innerHTML=texto;}
document.getElementById("formEjercicio").addEventListener("submit", function(e){e.preventDefault(); let a = Number(document.getElementById("a").value), b = Number(document.getElementById("b").value);
let op = document.getElementById("operacion").value, r;
switch(op) { case "suma": r=a+b; break; case "resta": r=a-b; break; case "multiplicacion": r=a*b; break; default: mostrar("Selecciona una operación."); return; }
mostrar("Resultado: " + r); });
</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
