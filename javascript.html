<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bienvenida de JavaScript</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="estilos.css"></head><body>
<nav class="navbar"><div class="container"><a class="navbar-brand fw-bold" href="index.html">Prácticas JS</a><a class="btn btn-sm btn-light" href="index.html">⌂ Menú principal</a></div></nav>
<main class="container py-4"><div class="row justify-content-center"><div class="col-12 col-lg-8"><div class="card"><div class="card-header p-3">Práctica 25 · Datos</div><div class="card-body p-4">
<h1 class="h3">Bienvenida de JavaScript</h1><p class="text-secondary">Ingresa los datos (si se solicitan) y presiona “Ejecutar ejercicio”.</p>
<form id="formEjercicio" class="mb-3"><div class="mb-3"><label for="nombre" class="form-label">Nombre</label><input class="form-control" id="nombre" type="text" required></div><div class="mb-3"><label for="edad" class="form-label">Edad</label><input class="form-control" id="edad" type="number" required></div><button type="submit" class="btn btn-primary">Ejecutar ejercicio</button></form><div id="resultado" class="resultado" aria-live="polite">Aquí aparecerá el resultado.</div>
<div class="d-flex flex-wrap justify-content-between gap-2 mt-4"><a class="btn btn-outline-secondary" href="datos.html">← Anterior</a><a class="btn btn-primary" href="index.html">Volver al menú</a></div>
</div></div></div></div></main><footer class="container text-center py-4">Práctica 25 de 25</footer><script>
function mostrar(texto){document.getElementById("resultado").innerHTML=texto;}
document.getElementById("formEjercicio").addEventListener("submit", function(e){e.preventDefault(); let nombre=document.getElementById("nombre").value.trim(), edad=document.getElementById("edad").value;
if(!nombre || !edad) { mostrar("Escribe tu nombre y edad."); return; }
mostrar(`¡Hola, ${nombre}!<br>Tu edad es: ${edad}`);
alert(`Hola ${nombre}, tienes ${edad} años.`); });
</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
