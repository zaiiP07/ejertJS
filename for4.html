<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tabla de multiplicar personalizada</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="estilos.css"></head><body>
<nav class="navbar"><div class="container"><a class="navbar-brand fw-bold" href="index.html">Prácticas JS</a><a class="btn btn-sm btn-light" href="index.html">⌂ Menú principal</a></div></nav>
<main class="container py-4"><div class="row justify-content-center"><div class="col-12 col-lg-8"><div class="card"><div class="card-header p-3">Práctica 12 · For</div><div class="card-body p-4">
<h1 class="h3">Tabla de multiplicar personalizada</h1><p class="text-secondary">Ingresa los datos (si se solicitan) y presiona “Ejecutar ejercicio”.</p>
<form id="formEjercicio" class="mb-3"><div class="mb-3"><label for="tabla" class="form-label">Número de tabla</label><input class="form-control" id="tabla" type="number" required></div><button type="submit" class="btn btn-primary">Ejecutar ejercicio</button></form><div id="resultado" class="resultado" aria-live="polite">Aquí aparecerá el resultado.</div>
<div class="d-flex flex-wrap justify-content-between gap-2 mt-4"><a class="btn btn-outline-secondary" href="for3.html">← Anterior</a><a class="btn btn-primary" href="index.html">Volver al menú</a><a class="btn btn-outline-secondary" href="promedio.html">Siguiente →</a></div>
</div></div></div></div></main><footer class="container text-center py-4">Práctica 12 de 25</footer><script>
function mostrar(texto){document.getElementById("resultado").innerHTML=texto;}
document.getElementById("formEjercicio").addEventListener("submit", function(e){e.preventDefault(); let tabla = Number(document.getElementById("tabla").value);
let salida = "";
for (let i = 1; i <= 10; i++) salida += `${tabla} × ${i} = ${tabla*i}<br>`;
mostrar(salida); });
</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
